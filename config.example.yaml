# Настройки голосового ассистента.
# При первом запуске этот файл копируется в config.yaml — меняйте config.yaml.
# Любой раздел или параметр можно не указывать: тогда берётся значение по умолчанию.
# Ключи API сюда не пишутся — они хранятся в файле .env (см. .env.example).

general:
  name: джарвис                  # имя ассистента (оно же слово активации)
  name_variants: [джарвиз, жарвис, jarvis]   # как ещё распознаватель может записать имя
  dry_run: false                 # true — действия только пишутся в журнал, но не выполняются
  debug: false                   # true — подробный лог, включая топ-3 кандидата матчера

matcher:
  threshold: 85                  # минимальная оценка совпадения фразы с командой (0–100)
  ambiguity_gap: 5               # если два лучших кандидата ближе, фраза уходит в нейросеть
  filler_words: [пожалуйста, слушай, ну, давай, ка, мне, будь добр, будь добра, эй, окей]
  split_words: [а затем, а потом, и затем, и потом, затем, потом, и]

commands:
  dir: commands                  # папка с YAML-паками команд
  user_file: my.yaml             # ваш пак: грузится последним и может перекрывать встроенные команды

apps:
  # Разговорное название → название приложения из меню «Пуск», путь к программе или URI.
  aliases:
    телега: Telegram
    телеграм: Telegram
    хром: Google Chrome
    гугл хром: Google Chrome
    эдж: Microsoft Edge
    яндекс браузер: Yandex
    вс код: Visual Studio Code
    вскод: Visual Studio Code
    дискорд: Discord
    стим: Steam
    спотифай: Spotify
    блокнот: notepad.exe
    калькулятор: calc.exe
    проводник: explorer.exe
    диспетчер задач: taskmgr.exe
    командная строка: cmd.exe
    параметры: "ms-settings:"
    настройки: "ms-settings:"
  match_threshold: 80            # минимальная оценка при поиске приложения по названию
  launch_wait: 3                 # сколько секунд ждать окна запущенного приложения
  exclude: [uninstall, удалить, удаление, деинсталл, readme, help, справка, website, веб-сайт,
            documentation, документация, license, лицензия, release notes]

browser:
  search_url: "https://www.google.com/search?q={query}"
  youtube_search_url: "https://www.youtube.com/results?search_query={query}"

voice:
  enabled: true                  # false — только ввод текстом в консоли
  wake_word: true                # активация по имени ассистента (general.name)
  push_to_talk: true             # активация горячей клавишей
  push_to_talk_key: ctrl+alt+space
  push_to_talk_mode: press       # press — нажать и говорить (конец по паузе), hold — говорить, удерживая клавиши
  stop_key: ctrl+alt+q           # прервать речь ассистента и задачу нейросети
  followup_seconds: 5            # сколько секунд после ответа слушать продолжение без имени
  listen_timeout: 6              # сколько секунд ждать начала фразы после активации
  min_silence_ms: 700            # пауза, после которой фраза считается законченной
  max_phrase_seconds: 15
  vad_threshold: 0.5             # чувствительность детектора речи: меньше — чувствительнее
  input_device: null             # номер или часть названия микрофона (список: --list-devices)
  sounds: true                   # короткий сигнал «слушаю»
  wake_confidence: 0.8           # уверенность распознавания имени (0–1): больше — реже ложные срабатывания
  verify_wake_word: true         # имя должно быть и в тексте от Whisper (отсекает ложные срабатывания)
  confirm_timeout: 5             # сколько секунд ждать «да» или «нет» при подтверждении
  confirm_confidence: 0.7        # уверенность распознавания «да/нет»
  stop_confidence: 0.8           # уверенность распознавания «стоп» / «отмена» во время задачи и ответа
  vosk_model: models/vosk-model-small-ru-0.22

stt:
  model: auto                    # auto: large-v3-turbo на видеокарте NVIDIA, small на процессоре;
                                 # или tiny, base, small, medium, large-v3, large-v3-turbo
  device: auto                   # auto, cuda или cpu
  compute_type: auto             # auto: float16 на видеокарте, int8 на процессоре
  beam_size: 5                   # 5 — точнее, 1 — на несколько процентов быстрее
  cpu_threads: 0                 # потоков для распознавания на процессоре; 0 — по числу ядер, но не меньше 4
  download_dir: models/whisper
  prompt_app_names: 30           # сколько названий программ подсказывать распознавателю

tts:
  engine: piper                  # piper — офлайн, по умолчанию;
                                 # silero — офлайн, нейросеть (при первом выборе скачивается ~300 МБ);
                                 # edge — голоса Microsoft через интернет; sapi — голоса Windows
  piper_voice: models/piper/ru_RU-dmitri-medium.onnx  # ещё есть irina, denis, ruslan
  silero_speaker: aidar          # голос Silero: aidar, eugene (мужские), baya, kseniya, xenia (женские)
  silero_model: models/silero/v5_6_ru.pt
  edge_voice: ru-RU-DmitryNeural # или ru-RU-SvetlanaNeural
  sapi_voice: ""                 # часть названия голоса Windows; пусто — первый русский
  rate: 1.0                      # скорость речи
  volume: 1.0

llm:
  enabled: true                  # false — фразы, которых нет среди команд, в нейросеть не уходят
  profile: deepseek              # deepseek, openai (ChatGPT), anthropic (Claude), ollama, opencode_zen или свой
  max_steps: 15                  # сколько раз агент может обратиться к нейросети за одну задачу
  timeout: 120                   # лимит на всю задачу, секунды
  request_timeout: 30            # лимит на один запрос, секунды
  retries: 2                     # повторы при ошибках сети, таймаутах и 429
  history: 10                    # сколько последних обменов помнить
  reset_after: 300               # через сколько секунд тишины забыть разговор
  # Профили провайдеров. Проще всего выбрать провайдера и вставить ключ в настройках
  # программы. Можно поменять поля встроенного профиля или добавить свой (любой
  # OpenAI-совместимый сервис): указанные поля заменяют встроенные, остальные остаются.
  profiles:
    deepseek:
      title: DeepSeek
      base_url: https://api.deepseek.com
      model: deepseek-flash
      api_key_env: DEEPSEEK_API_KEY        # в какой переменной .env лежит ключ
      vision: true                         # понимает картинки: describe_screen прикладывает снимок экрана
      temperature: 0.3
      extra_body: {thinking: {type: disabled}}   # быстрый режим без рассуждений
    openai:
      title: ChatGPT
      base_url: https://api.openai.com/v1
      model: gpt-6-luna                    # ещё gpt-5.4-mini, gpt-6-sol, gpt-5.5
      api_key_env: OPENAI_API_KEY
      vision: true
      effort: none                         # без рассуждений: иначе модели OpenAI не вызывают действия
    anthropic:
      title: Claude
      provider: anthropic                  # через официальный SDK anthropic
      model: claude-opus-5-5
      api_key_env: ANTHROPIC_API_KEY
      vision: true
      max_tokens: 16000
      effort: low                          # сколько думать: low — быстрее всего
    ollama:                                # локально, без интернета и без ключа
      title: Ollama (без интернета)
      base_url: http://localhost:11434/v1
      model: qwen3:8b                      # с картинками — например qwen2.5vl, и тогда vision: true
      temperature: 0.3
      extra_body: {reasoning_effort: none}  # без «размышлений» — быстрее
    opencode_zen:
      title: OpenCode Zen
      base_url: https://opencode.ai/zen/v1
      model: deepseek-v4-flash-free
      api_key_env: OPENCODE_API_KEY
      temperature: 0.3

ui:
  enabled: true                  # false — консольный режим без окон (как на этапах 1–3)
  theme: dark                    # dark или light
  accent: "#7c6cff"              # акцентный цвет
  overlay: true                  # оверлей внизу экрана: что услышал и что делает
  overlay_style: classic         # classic — плашка, orb — сфера, которая отзывается на голос
  overlay_keep: false            # true — итог голосовой команды виден до следующей фразы (клик — спрятать)
  quick_chat_key: ctrl+alt+enter # окно для команды текстом
  start_minimized: false         # true — при запуске сразу свернуться в трей

logging:
  level: INFO                    # DEBUG, INFO, WARNING или ERROR
  dir: logs
  file: assistant.log            # лог программы
  journal: actions.jsonl         # журнал всех выполненных действий
