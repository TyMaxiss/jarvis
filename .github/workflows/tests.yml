name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # Тесты, которые создают окна и печатают в них через SendInput.
      JARVIS_DESKTOP_TESTS: "1"
      # Сам ключ сюда не попадает — только признак, что секрет задан.
      HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --locked

      - name: Тесты
        run: uv run pytest -v -rs

      - name: Запуск консольного режима (dry-run, без голоса)
        shell: pwsh
        run: |
          "сделай громче`nкоторый час`n:apps power`n:q" | uv run python -m assistant --text --dry-run

      - name: Кэш моделей
        uses: actions/cache@v5
        with:
          path: models
          key: models-v3-vosk-small-ru-0.22-piper-4-voices-whisper-small

      - name: Скачивание моделей
        run: |
          uv run python -m assistant --download-models
          # Ещё три голоса — разные дикторы для калибровки слова активации.
          uv run python -m piper.download_voices ru_RU-irina-medium ru_RU-denis-medium ru_RU-ruslan-medium --download-dir models/piper

      - name: Голос на настоящих моделях (Piper → VAD → Vosk → Whisper)
        timeout-minutes: 12
        env:
          JARVIS_E2E: "1"
        run: uv run pytest -v -rs tests/test_voice_e2e.py --log-cli-level=WARNING -o faulthandler_timeout=120

      - name: Живая проверка нейросети (если в секретах репозитория есть DEEPSEEK_API_KEY)
        if: env.HAS_DEEPSEEK_KEY == 'true'
        timeout-minutes: 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JARVIS_LIVE_LLM: "1"
          JARVIS_LIVE_PROFILE: deepseek
        run: uv run pytest -v -rs tests/test_llm_live.py --log-cli-level=WARNING
