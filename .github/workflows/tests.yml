name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # Тесты, которые создают окна и печатают в них через SendInput.
      JARVIS_DESKTOP_TESTS: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --locked

      - name: Тесты
        run: uv run pytest -v -rs

      - name: Запуск консольного режима (dry-run, без голоса)
        shell: pwsh
        run: |
          "сделай громче`nкоторый час`n:apps power`n:q" | uv run python -m assistant --text --dry-run

      - name: Кэш моделей
        uses: actions/cache@v5
        with:
          path: models
          key: models-v1-vosk-small-ru-0.22-piper-dmitri-medium-whisper-small

      - name: Скачивание моделей
        run: uv run python -m assistant --download-models

      - name: Голос на настоящих моделях (Piper → VAD → Vosk → Whisper)
        env:
          JARVIS_E2E: "1"
        run: uv run pytest -v -rs tests/test_voice_e2e.py --log-cli-level=WARNING
