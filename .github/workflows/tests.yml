name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # Тесты, которые создают окна и печатают в них через SendInput.
      JARVIS_DESKTOP_TESTS: "1"
      # Сами ключи сюда не попадают — только признаки, что секреты заданы.
      HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --locked

      - name: WebView2 Runtime для окон (если его нет на раннере)
        shell: pwsh
        run: |
          $client = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path "HKLM:\$client" -Name pv -ErrorAction SilentlyContinue).pv
          if ($version -and $version -ne '0.0.0.0') { "WebView2 $version уже есть"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
          Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait
          "WebView2 $((Get-ItemProperty -Path "HKLM:\$client" -Name pv).pv) установлен"

      - name: Тесты (вместе с окнами интерфейса на рабочем столе раннера)
        timeout-minutes: 15
        run: uv run pytest -v -rs

      - name: Запуск консольного режима (dry-run, без голоса)
        shell: pwsh
        run: |
          "сделай громче`nкоторый час`n:apps power`n:q" | uv run python -m assistant --console --text --dry-run

      - name: Кэш моделей
        uses: actions/cache@v5
        with:
          path: models
          key: models-v3-vosk-small-ru-0.22-piper-4-voices-whisper-small

      - name: Скачивание моделей
        run: |
          uv run python -m assistant --download-models
          # Ещё три голоса — разные дикторы для калибровки слова активации.
          uv run python -m piper.download_voices ru_RU-irina-medium ru_RU-denis-medium ru_RU-ruslan-medium --download-dir models/piper

      - name: Голос на настоящих моделях (Piper → VAD → Vosk → Whisper)
        timeout-minutes: 12
        env:
          JARVIS_E2E: "1"
        run: uv run pytest -v -rs tests/test_voice_e2e.py --log-cli-level=WARNING -o faulthandler_timeout=120

      - name: Живая проверка нейросети (если в секретах репозитория есть DEEPSEEK_API_KEY)
        if: env.HAS_DEEPSEEK_KEY == 'true'
        timeout-minutes: 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JARVIS_LIVE_LLM: "1"
          JARVIS_LIVE_PROFILE: deepseek
        run: uv run pytest -v -rs tests/test_llm_live.py --log-cli-level=WARNING

      - name: Живая проверка ChatGPT (если в секретах есть OPENAI_API_KEY)
        if: env.HAS_OPENAI_KEY == 'true'
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JARVIS_LIVE_LLM: "1"
          JARVIS_LIVE_PROFILE: openai
        run: uv run pytest -v -rs tests/test_llm_live.py --log-cli-level=WARNING

      - name: Живая проверка Claude (если в секретах есть ANTHROPIC_API_KEY)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JARVIS_LIVE_LLM: "1"
          JARVIS_LIVE_PROFILE: anthropic
        run: uv run pytest -v -rs tests/test_llm_live.py --log-cli-level=WARNING

  exe:
    name: Сборка exe (PyInstaller)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Зависимости и PyInstaller
        run: uv sync --locked --group build

      - name: WebView2 Runtime для окон (если его нет на раннере)
        shell: pwsh
        run: |
          $client = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path "HKLM:\$client" -Name pv -ErrorAction SilentlyContinue).pv
          if ($version -and $version -ne '0.0.0.0') { "WebView2 $version уже есть"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
          Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait

      - name: Сборка
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/jarvis.spec

      - name: Проверка сборки (на копии — dist остаётся чистым)
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\Jarvis"
          Copy-Item dist\Jarvis $app -Recurse
          # Нативные части: Vosk, Whisper, VAD, Piper, звук, .NET и WebView2, UI Automation, SAPI.
          & "$app\JarvisConsole.exe" --self-check
          if ($LASTEXITCODE) { Get-Content "$app\logs\assistant.log" -Tail 80; exit $LASTEXITCODE }
          # Библиотеки CUDA, как при первом запуске с видеокартой: PyPI, sha256, распаковка, LoadLibrary.
          & "$app\JarvisConsole.exe" --download-cuda
          if ($LASTEXITCODE) { Get-Content "$app\logs\assistant.log" -Tail 80; exit $LASTEXITCODE }
          if (-not (Test-Path "$app\cuda\cudnn_ops64_9.dll")) { throw "в папке cuda нет cuDNN" }
          if (Test-Path "$app\cuda.download") { throw "cuda.download не убрана" }
          # Модели для голоса — тем же кодом, что при первом запуске: Vosk, Piper, Whisper small.
          & "$app\JarvisConsole.exe" --download-models
          if ($LASTEXITCODE) { Get-Content "$app\logs\assistant.log" -Tail 80; exit $LASTEXITCODE }
          foreach ($model in 'vosk-model-small-ru-0.22\am', 'piper\ru_RU-dmitri-medium.onnx.json',
                             'whisper\models--Systran--faster-whisper-small') {
            if (-not (Test-Path "$app\models\$model")) { throw "не скачалось: models\$model" }
          }
          # Голоса: Piper, edge-tts (через интернет) и Silero — PyTorch и модель скачиваются,
          # синтез идёт в отдельном процессе JarvisConsole.exe --silero-worker.
          foreach ($voice in 'piper', 'edge') {
            & "$app\JarvisConsole.exe" --test-voice $voice
            if ($LASTEXITCODE) { Get-Content "$app\logs\assistant.log" -Tail 80; exit $LASTEXITCODE }
          }
          & "$app\JarvisConsole.exe" --download-silero
          if ($LASTEXITCODE) {
            Get-Content "$app\logs\assistant.log" -Tail 80
            if (Test-Path "$app\logs\silero.log") { Get-Content "$app\logs\silero.log" -Tail 80 }
            exit $LASTEXITCODE
          }
          "который час`nсделай громче`n:q" | & "$app\JarvisConsole.exe" --console --text --dry-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$app\config.yaml")) { throw "config.yaml не создан рядом с exe" }
          if (-not (Test-Path "$app\commands\my.yaml")) { throw "my.yaml не создан из образца" }
          # Окна: консольный exe с той же папкой _internal (у Jarvis.exe ошибка открыла бы диалог).
          $p = Start-Process "$app\JarvisConsole.exe" -ArgumentList '--text', '--dry-run' -PassThru -NoNewWindow
          Start-Sleep 25
          $log = "$app\logs\assistant.log"
          if ($p.HasExited) { Get-Content $log -Tail 80; throw "окна закрылись, код $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (Select-String $log -Pattern 'No module named|ModuleNotFoundError|DLL load failed' -Quiet) {
            Get-Content $log -Tail 80; throw "в сборке чего-то не хватает"
          }

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path assistant\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $places = "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe"
          $iscc = Get-ChildItem $places -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem $places | Select-Object -First 1
          }
          & $iscc.FullName /Q "/DAppVersion=$version" "/DSourceDir=$pwd\dist\Jarvis" "/DOutputDir=$pwd\setup" `
            "/DIconFile=$pwd\build\jarvis\jarvis.ico" packaging\jarvis.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem setup | Format-Table Name, @{ n = 'МБ'; e = { [math]::Round($_.Length / 1MB) } }

      - name: Проверка установщика (установка, обновление поверх запущенной программы, удаление)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem setup\Jarvis-Setup-*.exe | Select-Object -First 1).FullName
          $version = $setup -replace '.*Jarvis-Setup-(.+)\.exe$', '$1'
          $dir = "$env:RUNNER_TEMP\JarvisInstalled"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F1C2B84-5A7E-4E2B-9C1D-3A8F0E6B7D21}_is1'
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Джарвис.lnk"
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`""

          # Установка: тихо и без прав администратора — в «Приложения» и «Пуск» этого пользователя.
          $p = Start-Process $setup -ArgumentList ($silent + "/LOG=`"$env:RUNNER_TEMP\setup.log`"") -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60; throw "установка: код $($p.ExitCode)" }
          foreach ($file in 'Jarvis.exe', 'JarvisConsole.exe', '_internal', 'config.example.yaml', 'unins000.exe') {
            if (-not (Test-Path "$dir\$file")) { throw "не установлено: $file" }
          }
          $entry = Get-ItemProperty -LiteralPath $key
          "В «Приложениях»: $($entry.DisplayName) $($entry.DisplayVersion), $($entry.InstallLocation)"
          if ($entry.DisplayVersion -ne $version) { throw "в «Приложениях» версия $($entry.DisplayVersion)" }
          if (-not (Test-Path -LiteralPath $menu)) { throw "нет ярлыка в «Пуске»" }
          & "$dir\JarvisConsole.exe" --self-check
          if ($LASTEXITCODE) { Get-Content "$dir\logs\assistant.log" -Tail 80; exit $LASTEXITCODE }

          # Обновление, как по кнопке «Обновить»: программа работает, установщик ждёт её выхода,
          # заменяет _internal целиком, а пользовательские файлы не трогает, и запускает программу снова.
          $app = Start-Process "$dir\JarvisConsole.exe" -ArgumentList '--text', '--dry-run' -PassThru -NoNewWindow
          Start-Sleep 15
          if ($app.HasExited) { Get-Content "$dir\logs\assistant.log" -Tail 80; throw "программа не запустилась" }
          New-Item "$dir\_internal\stale.txt" -Value 'от прежней версии' | Out-Null
          $update = Start-Process $setup -ArgumentList ($silent + '/RELAUNCH=yes' + "/LOG=`"$env:RUNNER_TEMP\update.log`"") -PassThru
          $null = $update.Handle  # без этого PowerShell не узнает код выхода
          Start-Sleep 5
          if ($update.HasExited) { Get-Content "$env:RUNNER_TEMP\update.log" -Tail 60; throw "установщик не дождался выхода программы" }
          Stop-Process -Id $app.Id
          if (-not $update.WaitForExit(180000)) { throw "обновление не закончилось за 3 минуты" }
          if ($update.ExitCode) { Get-Content "$env:RUNNER_TEMP\update.log" -Tail 60; throw "обновление: код $($update.ExitCode)" }
          if (Test-Path "$dir\_internal\stale.txt") { throw "файлы прежней версии остались в _internal" }
          foreach ($file in 'config.yaml', 'commands\my.yaml') {
            if (-not (Test-Path "$dir\$file")) { throw "обновление стёрло $file" }
          }
          $relaunched = $null
          for ($i = 0; $i -lt 30 -and -not $relaunched; $i++) {
            Start-Sleep 1
            $relaunched = Get-Process Jarvis -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir\*" }
          }
          if (-not $relaunched) { Get-Content "$env:RUNNER_TEMP\update.log" -Tail 60; throw "после обновления программа не запустилась" }
          "После обновления запущен $($relaunched.Path)"
          $relaunched | Stop-Process

          # Удаление: тихое оставляет настройки; ярлык и запись в «Приложениях» уходят.
          & "$dir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for ($i = 0; $i -lt 90 -and (Test-Path "$dir\Jarvis.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Jarvis.exe") { throw "программа не удалилась" }
          if (Test-Path -LiteralPath $key) { throw "запись в «Приложениях» осталась" }
          if (Test-Path -LiteralPath $menu) { throw "ярлык в «Пуске» остался" }
          if (-not (Test-Path "$dir\config.yaml")) { throw "тихое удаление стёрло настройки" }

      - uses: actions/upload-artifact@v7
        with:
          name: Jarvis-win-x64
          path: dist/
          include-hidden-files: true  # .env.example
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Setup
          path: setup/
          if-no-files-found: error
          retention-days: 14

  ui:
    name: Интерфейс (React) и сквозная проверка с Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Зависимости интерфейса
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты интерфейса (vitest)
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Сборка в репозитории совпадает со свежей (ui/dist)
        run: |
          git status --porcelain -- dist
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::ui/dist устарел: выполните npm --prefix ui run build и закоммитьте ui/dist"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python и Chromium для сквозной проверки
        run: |
          uv sync --locked
          npx playwright install --with-deps chromium

      - name: Интерфейс в Chromium с настоящим Python за мостом
        env:
          JARVIS_UI_E2E: "1"
        run: uv run pytest -v -rs ../tests/test_ui_e2e.py

  release:
    # Релиз — когда в assistant/__init__.py версия без .dev, которой ещё нет на GitHub.
    # По нему программа узнаёт о новой версии (assistant/updates.py).
    name: Релиз на GitHub
    needs: [windows, exe, ui]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # создать релиз
      actions: read  # скачать сборки этого запуска
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Нужен ли релиз
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' assistant/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -z "$version" || "$version" == *dev* ]]; then
            echo "Версия «$version» в разработке — релиза нет"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "Релиз v$version уже есть"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Релиз v${{ steps.version.outputs.version }}
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in Jarvis-Setup Jarvis-win-x64; do
            gh run download "$GITHUB_RUN_ID" --name "$name" --dir "artifacts/$name"
          done
          mkdir release
          setup="Jarvis-Setup-$VERSION.exe"
          archive="Jarvis-$VERSION-win-x64.zip"
          cp "artifacts/Jarvis-Setup/$setup" release/
          (cd artifacts/Jarvis-win-x64 && zip -qr9 "../../release/$archive" Jarvis)
          (cd release && sha256sum "$setup" "$archive" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Описание релиза — раздел этой версии из CHANGELOG.md.
          python3 - "$VERSION" > notes.md <<'EOF'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          section = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(section[1].strip() if section else f"Джарвис {version}")
          EOF
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Джарвис $VERSION" --notes-file notes.md
