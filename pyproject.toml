[project]
name = "jarvis-assistant"
version = "0.9.0.dev2"
description = "Голосовой ассистент для Windows 11: локальные команды из YAML и LLM-агент"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "ruamel.yaml>=0.19",
    "rapidfuzz>=3.14",
    "python-dotenv>=1.2",
    "psutil>=7.2",
    "comtypes>=1.4.17; sys_platform == 'win32'",
    "pycaw>=20260927; sys_platform == 'win32'",
    "numpy>=2.0",
    "sounddevice>=0.5.6",
    "onnxruntime>=1.20",
    "vosk>=0.3.45",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "keyboard>=0.13.5 ; sys_platform == 'win32'",
    "openai>=3.35.1,<4",
    "pyperclip>=1.11",
    "anthropic>=1.17,<2",
    "pywebview==6.2.1 ; sys_platform == 'win32'",
    "pythonnet>=3.0.5,<3.1 ; sys_platform == 'win32'",
    "pystray==0.19.5 ; sys_platform == 'win32'",
    "pillow>=11",
    "edge-tts>=7.3.1,<8",
]

[project.optional-dependencies]
# Библиотеки CUDA для Whisper на видеокарте NVIDIA: uv sync --extra cuda (~1,2 ГБ).
cuda = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
# Голос Silero: PyTorch (CPU) для отдельного процесса синтеза — uv sync --extra silero.
# Сборка exe скачивает те же колёса сама, когда выбирают Silero.
silero = [
    "torch>=2.14.1; sys_platform == 'win32'",
]

[dependency-groups]
# Сборка exe: uv sync --group build, затем pyinstaller packaging/jarvis.spec (см. README).
build = [
    "pyinstaller>=6.22.3,<7",
    "pyinstaller-hooks-contrib>=2026.9",
]
dev = ["pytest>=9.1"]

[tool.uv]
# Это приложение, а не библиотека: пакет не собирается, запуск через `python -m assistant`.
package = false
# Целевая платформа — Windows; Linux нужен только для разработки и тестов.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "windows: тест работает только в настоящей Windows",
    "desktop: тесту нужен интерактивный рабочий стол Windows (фокус окон, ввод с клавиатуры)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
