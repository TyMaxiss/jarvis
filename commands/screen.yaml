# Нажать кнопку, ссылку или пункт меню в активном окне по названию (UI Automation).
# Просто «нажми …» сюда не входит: «нажми энтер» — это клавиша, такие просьбы решает нейросеть.

- id: click_element
  phrases: ["нажми на {text}", "нажми кнопку {text}", "нажми на кнопку {text}", "кликни {text}",
            "кликни на {text}", "кликни по {text}", "щёлкни на {text}", "щёлкни по {text}"]
  slots: {text: text}
  reply: "{result}"
  steps:
    - click_ui_element: {text: "{text}"}
