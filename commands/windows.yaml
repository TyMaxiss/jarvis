# Окна, программы и система.
# Формат команд описан в README.md («Как добавить свою команду»).

- id: minimize_all
  phrases: ["сверни все окна", "сверни окна", "покажи рабочий стол"]
  steps:
    - hotkey: {keys: "win+d"}

# Win+D — переключатель: повторное нажатие возвращает окна, свёрнутые командой выше.
- id: restore_all
  phrases: ["разверни все окна", "верни все окна", "разверни обратно"]
  steps:
    - hotkey: {keys: "win+d"}

- id: window_minimize
  phrases: ["сверни окно", "сверни это окно", "сверни"]
  steps:
    - window_action: {action: minimize}

- id: window_maximize
  phrases: ["разверни окно", "разверни это окно", "разверни на весь экран", "разверни"]
  steps:
    - window_action: {action: maximize}

- id: window_close
  phrases: ["закрой окно", "закрой это окно", "закрой текущее окно"]
  steps:
    - window_action: {action: close}

- id: switch_window
  phrases: ["переключи окно", "предыдущее окно", "верни окно"]
  steps:
    - hotkey: {keys: "alt+tab"}

- id: active_window
  phrases: ["какое окно активно", "что за окно", "какое сейчас окно"]
  reply: "{result}"
  steps:
    - get_active_window: {}

- id: focus_window
  phrases: ["переключись на {title}", "перейди в {title}", "перейди на {title}", "покажи окно {title}"]
  steps:
    - focus_window: {title: "{title}"}

- id: open_app
  phrases: ["открой {name}", "запусти {name}", "открыть {name}", "запустить {name}"]
  steps:
    - open_app: {name: "{name}"}

- id: close_app
  phrases: ["закрой {name}", "закрыть {name}", "выйди из {name}"]
  steps:
    - close_app: {name: "{name}"}

- id: task_manager
  phrases: ["открой диспетчер задач", "диспетчер задач"]
  steps:
    - hotkey: {keys: "ctrl+shift+esc"}

- id: explorer
  phrases: ["открой проводник", "проводник", "открой мой компьютер"]
  steps:
    - hotkey: {keys: "win+e"}

- id: windows_settings
  phrases: ["открой параметры", "открой настройки", "параметры windows", "настройки windows"]
  steps:
    - hotkey: {keys: "win+i"}

- id: screenshot
  phrases: ["сделай скриншот", "скриншот", "снимок экрана"]
  steps:
    - hotkey: {keys: "win+shift+s"}

- id: type_text
  phrases: ["напечатай {text}", "введи текст {text}"]
  slots: {text: text}  # с пунктуацией, как сказано
  steps:
    - type_text: {text: "{text}"}

- id: time
  phrases: ["который час", "сколько времени", "сколько сейчас времени", "какое сегодня число"]
  reply: "{result}"
  steps:
    - get_time: {}

# Питание. Сон, выключение и перезагрузка всегда спрашивают подтверждение.
- id: lock
  phrases: ["заблокируй компьютер", "заблокируй экран", "блокировка экрана"]
  steps:
    - lock: {}

- id: sleep
  phrases: ["спящий режим", "переведи компьютер в сон", "усыпи компьютер"]
  steps:
    - sleep: {}

- id: shutdown
  phrases: ["выключи компьютер", "выключение компьютера"]
  steps:
    - shutdown: {}

- id: restart
  phrases: ["перезагрузи компьютер", "перезагрузка компьютера"]
  steps:
    - restart: {}

# Папки и буфер обмена.
- id: open_downloads
  phrases: ["открой загрузки", "открой папку загрузки"]
  steps:
    - open_folder: {path: "Загрузки"}

- id: open_documents
  phrases: ["открой документы", "открой папку документы"]
  steps:
    - open_folder: {path: "Документы"}

- id: clipboard_read
  phrases: ["что в буфере обмена", "прочитай буфер обмена"]
  reply: "{result}"
  steps:
    - clipboard_get: {}
